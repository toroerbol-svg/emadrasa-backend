services:
  postgres:
    image: postgres:16-alpine
    container_name: emadrasa-postgres
    environment:
      POSTGRES_DB: emadrasa_db
      POSTGRES_USER: emadrasa_user
      POSTGRES_PASSWORD: emadrasa_password
    ports:
      - "5432:5432"
    volumes:
      - emadrasa_pgdata:/var/lib/postgresql/data

volumes:
  emadrasa_pgdata: